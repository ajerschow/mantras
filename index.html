, used to write a vowel not following a consonant) with the long-vowel sign ཱ and the visarga ཿ — together 'āḥ', a closing seed syllable associated with speech (compare oṃ āḥ hūṃ in the Vajra Guru mantra), sealing the mantra. This is the final syllable of the entire hundred-syllable mantra, so there is no following syllable to affect it."}]}],wordGrouping:"Eighty-one Tibetan syllable-blocks group into the same nine word-units as the Sanskrit word list above: Om-Vajra-Sattva | Samaya-Manupalaya | Vajrasattva-tvenopatiṣṭha-dṛḍho-me-bhava | the three 'me bhava' requests (well-pleased, well-nourished, devoted) | grant-me-all-siddhis / make-my-mind-excellent-hūṃ | ha-ha-ha-ha-hoḥ | Bhagavan-Vajra-of-all-Tathāgatas | do-not-abandon-me | be-the-Vajra-holder-great-pledge-being-āḥ. In practice this mantra is chanted as one continuous flow without pauses between most of these units."}},{id:"yuthok-nyingthig-mantra",title:"Oṃ Āḥ Hūṃ Vajra Guru Yuthok Yönten Gönpo Siddhi Hūṃ",deity:"Yuthok Yönten Gönpo (father of Tibetan medicine, regarded as an emanation of Guru Padmasambhava)",tags:["guru yoga","Tibetan medicine","Yuthok Nyingthig","native Tibetan name"],sanskrit:null,tibetan:{script:"ཨོཾ་ཨཱཿཧཱུྂ་བཛྲ་གུ་རུ་གཡུ་ཐོག་ཡོན་ཏན་མགོན་པོ་སིདྡྷི་ཧཱུྂ།",wylie:"oM AH hU~M badz+ra gu ru g.yu thog yon tan mgon po sid+d+hi hU~M",phonetic:"Om Ah Hung Benza Guru Yutok Yönten Gönpo Siddhi Hung",translation:"Oṃ Āḥ Hūṃ — Vajra Guru Yuthok Yönten Gönpo — grant attainments (siddhi), Hūṃ! A guru-yoga mantra of the Yuthok Nyingthig tradition, invoking Yuthok Yönten Gönpo (the legendary founder of Tibetan medicine) as an emanation of Padmasambhava.",scriptType:"mixed",intro:"This mantra is a hybrid: it opens and closes with the same Sanskrit-spelling blocks as the Vajra Guru mantra (Om Āḥ Hūṃ ... Siddhi Hūṃ), but its centre replaces 'Padma' with the genuinely Tibetan name of Yuthok Yönten Gönpo — 'Yuthok' ('Turquoise Roof', his family name) and 'Yönten Gönpo' ('Glorious/Lordly One of Good Qualities', part of his personal name). These middle syllables follow ordinary Tibetan reading rules (silent prefixes, vowel-fronting before certain suffixes), unlike the Sanskrit-spelling syllables around them.",words:[{script:"ཨོཾ་ཨཱཿཧཱུྂ",wylie:"oM AH hU~M",phon:"Om Ah Hung",gloss:"three seed syllables — body, speech, mind",syllables:[{tib:"ཨོཾ",wylie:"oM",phon:"Om",note:"The vowel-carrier letter ཨ (a-chen) with the vowel sign ོ (o) and the anusvāra ཾ (ṃ), spelling out oṃ syllable-by-syllable rather than with the single Oṃ ligature ༀ — both are read identically, representing the body aspect. The following ཨཱཿ begins with the same vowel-carrier ཨ and has no effect on this syllable's sound."},{tib:"ཨཱཿ",wylie:"AH",phon:"Ah",note:"The bare vowel-carrier letter ཨ (a) with the long-vowel sign ཱ (ā) and the visarga ཿ (two small circles stacked vertically), representing the Sanskrit final -ḥ — a light voiceless aspiration after the vowel. Together: 'āḥ', representing speech. The following ཧཱུྂ begins with ཧ and does not modify this syllable."},{tib:"ཧཱུྂ",wylie:"hU~M",phon:"Hung",note:"Root letter ཧ (ha) + long vowel sign ཱུ (ū) + anusvāra ྂ (ṃ) = 'hūṃ', representing mind, as in Om Mani Padme Hum. The following word begins with བཛྲ, which does not alter this syllable."}]},{script:"བཛྲ་གུ་རུ",wylie:"badz+ra gu ru",phon:"Benza Guru",gloss:"Vajra Guru — 'the Vajra Master/Teacher'",syllables:[{tib:"བཛྲ",wylie:"badz+ra",phon:"Benza",note:"Root letter བ (ba) with ཛ (ja/dza) and ྲ (ra) both subjoined, reproducing the Sanskrit consonant cluster 'vajra'. Tibetans pronounce ཛ like 'dz', so the cluster comes out as 'badza/benza' — the familiar Tibetanised 'Benza' for 'Vajra'. The following གུ begins with plain ག and does not change this syllable."},{tib:"གུ",wylie:"gu",phon:"gu",note:"ག (ga) + vowel sign ུ (u) = 'gu'. The following རུ begins with ར and has no effect here."},{tib:"རུ",wylie:"ru",phon:"ru",note:"ར (ra) + vowel sign ུ (u) = 'ru'. Together གུ་རུ = 'guru', 'teacher/master', so བཛྲ་གུ་རུ = 'Vajra Guru'. The following word གཡུ begins a genuinely Tibetan name and does not affect the sound of this syllable."}]},{script:"གཡུ་ཐོག",wylie:"g.yu thog",phon:"Yutok",gloss:"Yuthok — 'Turquoise Roof' (the guru's family name)",syllables:[{tib:"གཡུ",wylie:"g.yu",phon:"yu",note:"A special combination letter: prefix ག written directly over the root letter ཡ (ya), with the vowel sign ུ (u). The prefix ག is silent in modern Central Tibetan pronunciation, but historically it marked this ཡ-syllable as belonging to a different register than a plain ཡ would have — in practice 'g.yu' is simply read 'yu'. Means 'turquoise', the precious stone for which this family/clan was named. The following ཐོག begins with ཐ and does not change this syllable's sound."},{tib:"ཐོག",wylie:"thog",phon:"tok",note:"Root letter ཐ (tha, an aspirate) with the vowel sign ོ (o) and the suffix letter ག (ga). Suffix ག, ད and བ are not released as full consonants in modern speech — they surface as an unreleased final stop, here giving a short final '-k', and they also shorten/clip the preceding vowel, so 'tho' + suffix ག is heard as 'tok' rather than 'thok'. Meaning 'roof'. Together གཡུ་ཐོག = 'Yutok', 'Turquoise Roof' — the family name of Yuthok Yönten Gönpo, the father of Tibetan medicine. This is the final syllable of the word; the following word ཡོན begins with ཡ and does not affect this syllable's sound."}]},{script:"ཡོན་ཏན",wylie:"yon tan",phon:"Yönten",gloss:"yönten — 'good qualities, virtues' (part of the guru's personal name)",syllables:[{tib:"ཡོན",wylie:"yon",phon:"yön",note:"Root letter ཡ (ya) with the vowel sign ོ (o) and the suffix letter ན (na). The suffix ན is pronounced as a final '-n', but it also 'fronts' (umlauts) the preceding vowel: -o followed by suffix ན is regularly heard as '-ön' rather than plain '-on'. So ཡོན is pronounced 'yön', not 'yon'. The following ཏན begins with ཏ and does not change this syllable's sound."},{tib:"ཏན",wylie:"tan",phon:"ten",note:"Root letter ཏ (ta) with its inherent vowel 'a' and the suffix letter ན (na). As with the previous syllable, the suffix ན fronts the vowel: -a + suffix ན is regularly heard as '-en', so ཏན is pronounced 'ten', not 'tan'. Together ཡོན་ཏན = 'yönten', 'good qualities/virtues' — part of the guru's personal name, Yönten Gönpo ('Lord of Good Qualities'). The following word མགོན begins with the silent prefix མ and does not affect this syllable's own sound."}]},{script:"མགོན་པོ",wylie:"mgon po",phon:"Gönpo",gloss:"gönpo — 'lord, protector' (part of the guru's personal name)",syllables:[{tib:"མགོན",wylie:"mgon",phon:"gön",note:"Root letter ག (ga) with the silent prefix letter མ (ma) written above it, the vowel sign ོ (o), and the suffix letter ན (na). The prefix མ is one of the five silent prefix consonants (ག ད བ མ འ) and is not pronounced, but — as in Lama Khyen-no — it can shift the syllable's register; here it keeps the naturally high-register ག from shifting further. The suffix ན again fronts the vowel, so -o + ན is heard as '-ön': མགོན is pronounced 'gön'. The following པོ begins with པ and does not change this syllable's sound."},{tib:"པོ",wylie:"po",phon:"po",note:"Root letter པ (pa) with the vowel sign ོ (o), no prefix or suffix: 'po'. Together མགོན་པོ = 'gönpo', 'lord, protector' — a common honorific epithet (cf. Chenrezig Gönpo). Combined with the previous word, ཡོན་ཏན་མགོན་པོ = 'Yönten Gönpo', '(the) Lord of Good Qualities', the guru's personal name. This is the final syllable of the word; the following word སིདྡྷི begins a return to Sanskrit-spelling mode and does not affect this syllable's sound."}]},{script:"སིདྡྷི",wylie:"sid+d+hi",phon:"Siddhi",gloss:"siddhi — accomplishment/attainment (the request: 'grant siddhi!')",syllables:[{tib:"སིདྡྷི",wylie:"sid+d+hi",phon:"Siddhi",note:"Root letter ས (sa) with vowel sign ི (i), carrying a stack of subjoined ད (da) and ྷ (the aspiration marker producing 'dha' — an aspirated sound foreign to native Tibetan), reproducing the Sanskrit cluster 'ddh' in siddhi. Read 'siddhi'. The closing ཧཱུྂ that follows begins with ཧ and does not change this syllable."}]},{script:"ཧཱུྂ",wylie:"hU~M",phon:"Hung",gloss:"closing seed syllable (hūṃ)",syllables:[{tib:"ཧཱུྂ",wylie:"hU~M",phon:"Hung",note:"= 'hūṃ' again (root ཧ + long ū + anusvāra ṃ), closing the mantra. As the final syllable, there is no following syllable to affect it."}]}],wordGrouping:"Fourteen Tibetan syllable-blocks group into seven units: Om | Ah | Hung (body–speech–mind, spelled out letter-by-letter rather than with the Oṃ ligature) | Benza-Guru ('Vajra Guru') | Yutok ('Turquoise Roof', the guru's family name) | Yönten-Gönpo ('Lord of Good Qualities', his personal name) | Siddhi-Hung ('grant attainments now'). The middle three words name Yuthok Yönten Gönpo directly, framed by the same opening/closing formula as the Vajra Guru mantra — reflecting his identity as an emanation of Padmasambhava."}},{id:"lama-khyen-no",title:"Lama Khyen-no (བླ་མ་མཁྱེན་ནོ།)",deity:"General devotional refrain addressed to one's Guru/Lama",tags:["native Tibetan","reading rules","tone & silent letters"],sanskrit:null,tibetan:{script:"བླ་མ་མཁྱེན་ནོ།",wylie:"bla ma mkhyen no",phonetic:"La-ma khyen-no",translation:`"Guru, think of me / know me (care for me)!" — a very common devotional refrain, e.g. in the lines '...la-ma khyen-no, khyen-no, khyen-no' ('Guru, think of me, think of me, think of me').`,scriptType:"native-tibetan",intro:"Unlike the mantras above, this phrase is genuinely Tibetan (not a Sanskrit transcription), so it is a good place to see the ordinary rules for Tibetan syllable structure: every syllable can have, in addition to a root letter and vowel sign, a prefix letter, superscript letter(s), subjoined letter(s), and a suffix (or even a second 'post-suffix') letter — and several of these are silent in modern speech while still shaping the tone and vowel quality of the syllable.",words:[{script:"བླ་མ",wylie:"bla ma",phon:"la-ma",gloss:"blama — 'guru/teacher' (lit. 'the higher one')",syllables:[{tib:"བླ",wylie:"bla",phon:"la (high tone)",note:"Structure: root letter བ (ba) with ལ (la) subjoined beneath it (la-btags), inherent vowel 'a'. In the combinations བླ, ཟླ, རླ and སླ the subjoined ལ takes over the sound and the root letter is silent — but it is NOT 'wasted': it shifts the syllable into HIGH register/tone. ལ on its own is one of the 'low' (voiced/resonant) consonants and would give a low-toned 'la'; with the silent བ, བླ is pronounced 'la' but in a HIGH tone, audibly different from plain ལ. (The same tone-raising effect comes from the superscripts ར, ལ, ས and the prefixes, seen in the next syllables.) Lexically, 'bla' is an old word for 'soul/highest/upper', seen in bla-ma 'guru' (lit. 'the higher one'). The following syllable མ begins with a plain low-register consonant and does not change this syllable's tone or sound."},{tib:"མ",wylie:"ma",phon:"ma (low tone)",note:"Simple root letter མ with inherent vowel 'a' — no prefix, superscript, subjoined or suffix letters at all. མ is a nasal 'low'-register consonant, so this syllable is pronounced with low tone: 'ma'. Together བླ་མ = 'lama' (high-low), the familiar word for 'guru/teacher'. The following word མཁྱེན begins with a silent prefix མ and does not affect this syllable's own sound."}]},{script:"མཁྱེན",wylie:"mkhyen",phon:"khyen (high tone)",gloss:"knows / thinks of / cares for (honorific verb)",syllables:[{tib:"མཁྱེན",wylie:"mkhyen",phon:"khyen (high tone)",note:"This syllable has four structural slots filled at once: (1) prefix letter མ (ma) — one of the five Tibetan prefix consonants (ག ད བ མ འ); prefixes are silent in modern pronunciation but they push the syllable into HIGH tone regardless of the root letter's own register; (2) root letter ཁ (kha), itself already a high-register consonant; (3) subjoined ྱ (ya-tags) under the root letter, which palatalises 'kha' to 'khya'; (4) vowel sign ེ (e), changing the inherent 'a' to 'e'; (5) suffix letter ན (na), which IS pronounced and closes the syllable with a final 'n'. Net result: silent-prefix(high tone) + khya + e + n = 'khyen', high tone. Meaning: the honorific verb root 'to know/think of/care for'. The following syllable ནོ begins with a plain low-register ན and does not change the sound of this syllable's final -n."}]},{script:"ནོ",wylie:"no",phon:"no (low tone)",gloss:"[petitionary particle — 'please']",syllables:[{tib:"ནོ",wylie:"no",phon:"no (low tone)",note:"Root letter ན (na, a low-register nasal) with the vowel sign ོ (o), no prefix or suffix: 'no', low tone. Functions here as a sentence-final particle giving the verb an imperative/petitionary nuance — roughly 'please do (know me)!'. The final ། mark is simply Tibetan punctuation (a 'shad', equivalent to a full stop). This is the last syllable of the phrase, so there is no following syllable to affect it."}]}],wordGrouping:"Three words across four syllable-blocks: bla-ma ('guru', 2 syllables forming one compound noun) + mkhyen ('knows/cares for', 1 syllable, the verb) + no (1 syllable, a final particle). Sentence pattern: Subject (Guru) + Verb (think-of-me) + Particle (please) — 'Guru, [please] think of me!'. Contrast this with the Sanskrit mantras above: here every silent letter (the prefix མ, the silent བ of བླ) is doing real grammatical/phonological work (raising tone), which is the system that does NOT apply when Tibetan letters are instead used to spell out Sanskrit."}},{id:"shakyamuni-mantra",title:"Oṃ Muni Muni Mahāmuni Śākyamuniye Svāhā",deity:"Śākyamuni Buddha (the historical Buddha, Siddhārtha Gautama)",tags:["Shakyamuni","historical Buddha","merit","purification","Sanskrit mantra"],sanskrit:{script:"ॐ मुनि मुनि महामुनि शाक्यमुनिये स्वाहा",transliteration:"oṃ muni muni mahāmuni śākyamuniye svāhā",translation:"Oṃ, O Sage, Sage, Great Sage, O Sage of the Śākyas — svāhā!",words:[{word:"oṃ",gloss:"the universal seed syllable",note:"The primordial sound, saluting and invoking the deity.",grammar:"Indeclinable interjection."},{word:"muni",gloss:"sage / silent one",note:"From the root √man ('to think'), muni denotes a sage who realises truth through inner silence. Repeated twice as an intensifier: 'Sage, Sage'. In Buddhist usage it is the standard epithet of the Buddha (the Silent Sage who emerged from silence to teach).",grammar:"Masculine i-stem noun used as an address. The classical vocative singular would be mune; mantric (Buddhist Hybrid) Sanskrit instead uses the bare stem muni as a vocative — the same 'bare stem' habit seen in vajra guru padma."},{word:"muni",gloss:"sage (second invocation)",note:"Repetition of the epithet for emphasis — a standard Vedic and Buddhist intensification pattern.",grammar:"Bare stem used as vocative, as above."},{word:"mahāmuni",gloss:"Great Sage",note:"mahā ('great', the compounding form of mahat) + muni: a superlative compound honouring the Buddha above all other sages.",grammar:"Karmadhāraya compound mahā-muni, again in the bare stem form used as a vocative."},{word:"śākyamuniye",gloss:"O Sage of the Śākyas",note:"Śākya (the clan name of the historical Buddha's family) + muni + the vocative suffix -ye (dative-inflected vocative used in Buddhist Hybrid Sanskrit). The Śākya clan ruled the small republic of Kapilavastu in present-day Nepal/India; 'Śākyamuni' ('Sage of the Śākyas') is the most common epithet of Siddhārtha Gautama.",grammar:"Buddhist Hybrid Sanskrit vocative-dative of the compound noun Śākya-muni."},{word:"svāhā",gloss:"svāhā — seal, so be it!",note:"The Vedic offering-cry, placed at the end of mantras as a seal that fixes the merit of the recitation. Literally means 'well-said' or 'hail!' and traditionally accompanied the pouring of offerings into fire. In Buddhist usage it simply closes and empowers the mantra.",grammar:"Indeclinable exclamation / offering formula."}]},tibetan:{script:"ༀ་མུ་ནི་མུ་ནི་མ་ཧཱ་མུ་ནི་ཤཱཀྱ་མུ་ནི་ཡེ་སྭཱ་ཧཱ།",wylie:"oM mu ni mu ni ma hA mu ni shAk+ya mu ni ye swA hA",phonetic:"Om Muni Muni Maha Muni Shakya Muni Ye Soha",translation:"Oṃ, Sage, Sage, Great Sage, Sage of the Śākyas — svāhā!",scriptType:"sanskrit-in-tibetan",intro:"This is Sanskrit spelled out letter by letter in Tibetan script (the same 'Sanskrit-spelling' mode as Om Mani Padme Hum and the Vajra Guru mantra). Ordinary Tibetan reading rules — silent prefixes, vowel-fronting before suffix ན, etc. — do not apply; each letter has its full Sanskrit sound value. The only points of interest are the subjoined ྱ in ཤཱཀྱ ('śākya', reproducing the Sanskrit cluster kya) and the long-vowel signs ཱ throughout (ā).",words:[{script:"ༀ",wylie:"oM",phon:"Om",gloss:"universal seed syllable",syllables:[{tib:"ༀ",wylie:"oM",phon:"Om",note:"The Oṃ ligature — the standard Tibetan representation of the Sanskrit seed syllable oṃ. The following མུ begins with མ and does not change the sound of this syllable."}]},{script:"མུ་ནི་མུ་ནི",wylie:"mu ni mu ni",phon:"Muni Muni",gloss:"Sage, Sage",syllables:[{tib:"མུ",wylie:"mu",phon:"mu",note:"Root letter མ (ma) with the vowel sign ུ (u): 'mu'. Begins the first muni. The following ནི begins with ན and does not change this syllable's sound."},{tib:"ནི",wylie:"ni",phon:"ni",note:"Root letter ན (na) with the vowel sign ི (i): 'ni'. Together མུ་ནི = 'muni', 'sage'. The following མུ begins the second muni and does not change this syllable's sound."},{tib:"མུ",wylie:"mu",phon:"mu",note:"Second repetition of མུ (ma + vowel ུ): 'mu'. The repetition intensifies the invocation. The following ནི begins with ན and does not change this syllable's sound."},{tib:"ནི",wylie:"ni",phon:"ni",note:"Second repetition of ནི (na + vowel ི): 'ni'. Together the two མུ་ནི་མུ་ནི = 'muni muni', 'Sage, Sage!' — a doubled invocation. The following མ begins mahā and does not change this syllable's sound."}]},{script:"མ་ཧཱ་མུ་ནི",wylie:"ma hA mu ni",phon:"Maha Muni",gloss:"Great Sage",syllables:[{tib:"མ",wylie:"ma",phon:"ma",note:"Root letter མ (ma) with inherent vowel 'a': 'ma'. Begins mahā, 'great'. The following ཧཱ begins with ཧ and does not change this syllable's sound."},{tib:"ཧཱ",wylie:"hA",phon:"ha",note:"Root letter ཧ (ha) with the long-vowel sign ཱ (ā): 'hā'. Together མ་ཧཱ = 'mahā', 'great' (only used in compounds in Sanskrit; it cannot stand alone). The following མུ begins muni and does not change this syllable's sound."},{tib:"མུ",wylie:"mu",phon:"mu",note:"Root letter མ (ma) with vowel sign ུ (u): 'mu'. Third occurrence of mu- in this mantra. The following ནི begins with ན and does not change this syllable's sound."},{tib:"ནི",wylie:"ni",phon:"ni",note:"Root letter ན (na) with vowel sign ི (i): 'ni'. Together མ་ཧཱ་མུ་ནི = 'mahāmuni', 'Great Sage' — the supreme epithet of the Buddha. The following ཤཱཀྱ begins with ཤ and does not change this syllable's sound."}]},{script:"ཤཱཀྱ་མུ་ནི་ཡེ",wylie:"shAk+ya mu ni ye",phon:"Shakya Muni Ye",gloss:"O Sage of the Śākyas",syllables:[{tib:"ཤཱཀྱ",wylie:"shAk+ya",phon:"shākya",note:"Root letter ཤ (śa — the Sanskrit palatal sibilant, found only in Sanskrit loanwords in Tibetan) with the long-vowel sign ཱ (ā), carrying a stack of ཀ (ka) with subjoined ྱ (ya) beneath it. The stack ཀྱ reproduces the Sanskrit consonant cluster 'ky' of Śākya (the clan name of the historical Buddha's family). Together ཤཱཀྱ = 'śākya'. The following མུ begins with མ and does not change this syllable's sound."},{tib:"མུ",wylie:"mu",phon:"mu",note:"Root letter མ (ma) with vowel sign ུ (u): 'mu'. Fourth occurrence of mu- in this mantra. The following ནི begins with ན and does not change this syllable's sound."},{tib:"ནི",wylie:"ni",phon:"ni",note:"Root letter ན (na) with vowel sign ི (i): 'ni'. Together ཤཱཀྱ་མུ་ནི = 'śākyamuni', 'Sage of the Śākyas', the primary proper name of the historical Buddha. The following ཡེ begins with ཡ and does not change this syllable's sound."},{tib:"ཡེ",wylie:"ye",phon:"ye",note:"Root letter ཡ (ya) with the vowel sign ེ (e): 'ye'. This is the Buddhist Hybrid Sanskrit vocative/dative suffix -ye added to śākyamuni, used in mantras to address a deity directly ('O Śākyamuni!'). The following སྭཱ begins with ས and does not change this syllable's sound."}]},{script:"སྭཱ་ཧཱ",wylie:"swA hA",phon:"Soha",gloss:"svāhā — seal of the mantra",syllables:[{tib:"སྭཱ",wylie:"swA",phon:"swa",note:"Root letter ས (sa) with ཝ (wa) subjoined beneath it and the long-vowel sign ཱ (ā) on top: together 'svā', the first syllable of svāhā. The subjoined ཝ reproduces Sanskrit 'v' (in Tibetan script ཝ stands for both 'w' and 'v' sounds). The following ཧཱ begins with ཧ and does not change this syllable's sound."},{tib:"ཧཱ",wylie:"hA",phon:"ha",note:"Root letter ཧ (ha) with the long-vowel sign ཱ (ā): 'hā'. Together སྭཱ་ཧཱ = 'svāhā', the ancient Vedic offering-cry that seals and empowers the mantra. This is the final syllable; there is no following syllable to affect it."}]}],wordGrouping:"Fifteen Tibetan syllable-blocks group into five units: Oṃ (seed syllable) | Muni-Muni (Sage, Sage — doubled invocation) | Mahā-Muni (Great Sage) | Śākya-Muni-ye (O Sage of the Śākyas — the Buddha's proper name plus vocative suffix) | Svāhā (sealing exclamation). The pattern of three progressively fuller invocations — muni, muni → mahā-muni → śākyamuni-ye — mirrors the triple repetition in many other Buddhist mantras and carries the practitioner from general invocation toward the specific, personal name of the historical Buddha."}},{id:"ye-dharma",title:"Ye Dharmā Hetu Prabhavā",deity:"Śākyamuni Buddha / the principle of pratītyasamutpāda (dependent origination)",tags:["dependent origination","Shakyamuni","liberation","purification","mantra of independence","ye dharma"],sanskrit:{script:"ये धर्मा हेतुप्रभवा हेतुन्तेषां तथागतो ह्यवदत् तेषां च यो निरोध एवं वादी महाश्रमणः",transliteration:"ye dharmā hetu-prabhavā hetun teṣāṃ tathāgato hy avadat teṣāṃ ca yo nirodha evaṃ vādī mahāśramaṇaḥ",translation:"Those phenomena that arise from causes — the Tathāgata has declared their cause, and also their cessation — thus the Great Śramaṇa teaches.",words:[{word:"ye dharmā",gloss:"those phenomena which",note:"ye is the nominative plural of the relative pronoun ya ('who/which'). dharmāḥ (phenomena, things, mental and physical events) contracts to dharmā before the following he- by sandhi. Together: 'those phenomena which...' — the subject of the relative clause.",grammar:"ye: nominative plural relative pronoun. dharmā: nominative plural of dharma (a-stem noun), shortened by sandhi."},{word:"hetu-prabhavā",gloss:"arise from causes",note:"A bahuvrīhi compound: hetu ('cause') + prabhavā (nominative plural of prabhava, 'arising/originating'). The whole compound means 'those whose arising is from causes', i.e. conditioned phenomena — everything that is not self-arisen. This is the First Noble Truth's underlying mechanism: all conditioned things have causes.",grammar:"Nominative plural bahuvrīhi compound agreeing with dharmā."},{word:"hetun teṣāṃ",gloss:"their cause",note:"hetun is the accusative singular of hetu ('cause'), here the direct object of avadat. teṣāṃ is the genitive plural of tad ('those/them'): 'their (i.e., those phenomena's) cause'. This picks up the antecedent ye dharmā above.",grammar:"hetun: accusative singular of the masculine u-stem hetu (hetum, with final -m written as -n before the following t- in this traditional spelling). teṣāṃ: genitive plural of tad."},{word:"tathāgato hy avadat",gloss:"the Tathāgata has indeed declared",note:"tathāgataḥ ('the Tathāgata', the Buddha's most formal epithet — literally 'one who has thus gone/come') becomes tathāgato by visarga sandhi before the voiced hy. hi ('indeed, for') becomes hy before the vowel a-. avadat is the 3rd-person singular imperfect of √vad ('to speak, declare'), meaning 'he said / he has declared'. The imperfect here gives a sense of completed, authoritative declaration.",grammar:"tathāgataḥ → tathāgato (sandhi). hi → hy (sandhi). avadat: 3rd singular imperfect active of √vad."},{word:"teṣāṃ ca yo nirodha",gloss:"and the cessation of those",note:"teṣāṃ: genitive plural again ('of those / their'). ca: 'and'. yo = yaḥ ('which'), nominative singular relative pronoun by sandhi before n-. nirodhaḥ (cessation, the Third Noble Truth — literally 'blocking/stopping': ni- 'down/back' + rodha from √rudh 'to obstruct') contracts to nirodha by sandhi. The Buddha declared not just the cause of suffering, but its cessation — this half of the verse gestures toward the Third and Fourth Noble Truths.",grammar:"yo: nominative singular of ya (sandhi before nirodha). nirodha: nominative singular a-stem by sandhi."},{word:"evaṃ vādī",gloss:"thus speaks (he who teaches thus)",note:"evaṃ: the adverb 'thus, in this way'. vādī is the nominative singular of vādin ('one who speaks, a teacher'), an agent noun from √vad — the same root as avadat above. Together: 'the one who teaches thus / the teacher of this doctrine'. Grammatically this is an appositive to mahāśramaṇaḥ.",grammar:"evaṃ: indeclinable adverb. vādī: nominative singular of vādin (in-stem agent noun)."},{word:"mahāśramaṇaḥ",gloss:"the Great Śramaṇa",note:"A compound: mahā ('great') + śramaṇaḥ ('one who strives/labours', a renunciant — from √śram 'to exert oneself'). Śramaṇa was the general Indian term for wandering renouncers (Buddhist, Jain and otherwise); 'Great Śramaṇa' is the Buddha's title within that tradition, distinguishing him as its pinnacle. The verse closes by naming the source of this teaching without using the word 'Buddha' at all — typical of early Buddhist verse.",grammar:"mahāśramaṇaḥ: nominative singular karmadharaya compound (a-stem)."}]},tibetan:{script:"ཡེ་དྷར་མཱ་ཧེ་ཏུ་པྲ་བྷ་བཱ་ཧེ་ཏུན་ཏེ་ཥཱཾ་ཏ་ཐཱ་ག་ཏོ་ཧྱ་བ་དཏ་ཏེ་ཥཱཾ་ཙ་ཡོ་ནི་རོ་དྷ་ཨེ་བཾ་བཱ་དི་མ་ཧཱ་ཤྲ་མ་ཎཿ།",wylie:"ye d+har mA he tu pra b+ha bA he tun te ShAM ta thA ga to h+ya ba dat te ShAM tsa yo ni ro d+ha e baM bA di ma hA sh+ra ma NaH",phonetic:"Ye Dharma Hetu Prabhawa Hetun Tesham Tathagato Hya Badat Tesham Tsa Yo Niro Dha Ewam Badi Maha Shramana",translation:"Those phenomena that arise from causes — the Tathāgata has declared their cause and also their cessation — thus the Great Śramaṇa teaches.",scriptType:"sanskrit-in-tibetan",intro:"This ancient verse is Sanskrit transcribed syllable-by-syllable into Tibetan script, following the same 'Sanskrit-spelling' mode as Om Mani Padme Hum. Ordinary Tibetan reading rules do not apply. Notable letter-stacks include དྷ (dha — voiced aspirate), བྷ (bha — voiced aspirate), ཥཱཾ (ṣāṃ — retroflex sibilant + long ā + anusvāra), ཧྱ (hya — ha with subjoined ya), དྷ (dha), and ཤྲ (śra — palatal sibilant with subjoined ra). Together these reproduce sounds that exist in Sanskrit but not in native Tibetan.",words:[{script:"ཡེ་དྷར་མཱ",wylie:"ye d+har mA",phon:"Ye Dharma",gloss:"those phenomena which",syllables:[{tib:"ཡེ",wylie:"ye",phon:"ye",note:"Root letter ཡ (ya) with vowel sign ེ (e): 'ye' — the relative pronoun 'which/those which'. The following དྷར begins with ད and does not change this syllable's sound."},{tib:"དྷར",wylie:"d+har",phon:"dhar",note:"Root letter ད (da) with the aspiration mark ྷ subjoined beneath it, giving the voiced aspirate 'dha' (a sound not native to Tibetan), followed by ར (ra) as a suffix closing the syllable — together 'dhar'. Begins dharma. The following མཱ begins with མ and does not change this syllable's sound."},{tib:"མཱ",wylie:"mA",phon:"ma",note:"Root letter མ (ma) with the long-vowel sign ཱ (ā): 'mā'. Together ཡེ་དྷར་མཱ = 'ye dharmā', 'those phenomena which'. The following ཧེ begins with ཧ and does not change this syllable's sound."}]},{script:"ཧེ་ཏུ་པྲ་བྷ་བཱ",wylie:"he tu pra b+ha bA",phon:"Hetu Prabhawa",gloss:"arise from causes",syllables:[{tib:"ཧེ",wylie:"he",phon:"he",note:"Root letter ཧ (ha) with vowel sign ེ (e): 'he'. Begins hetu, 'cause'. The following ཏུ begins with ཏ and does not change this syllable's sound."},{tib:"ཏུ",wylie:"tu",phon:"tu",note:"Root letter ཏ (ta) with vowel sign ུ (u): 'tu'. Together ཧེ་ཏུ = 'hetu', 'cause'. The following པྲ begins with པ and does not change this syllable's sound."},{tib:"པྲ",wylie:"pra",phon:"pra",note:"Root letter པ (pa) with ར (ra) subjoined beneath it, giving the cluster 'pr' plus the inherent vowel 'a': 'pra'. This is the Sanskrit verbal prefix 'forth/forth from'. The following བྷ begins with བྷ and does not change this syllable's sound."},{tib:"བྷ",wylie:"b+ha",phon:"bha",note:"Root letter བ (ba) with the aspiration mark ྷ subjoined: the voiced aspirate 'bha', a sound not native to Tibetan. Begins -bhavā, 'arising'. The following བཱ begins with བ and does not change this syllable's sound."},{tib:"བཱ",wylie:"bA",phon:"wa",note:"Root letter བ (ba, used here to represent Sanskrit 'v') with the long-vowel sign ཱ (ā): 'vā'. Together པྲ་བྷ་བཱ = 'prabhavā', '(those whose) arising is from (causes)'. The following ཧེ begins a new phrase and does not change this syllable's sound."}]},{script:"ཧེ་ཏུན་ཏེ་ཥཱཾ",wylie:"he tun te ShAM",phon:"Hetun Tesham",gloss:"their cause",syllables:[{tib:"ཧེ",wylie:"he",phon:"he",note:"Root letter ཧ (ha) with vowel sign ེ (e): 'he'. Begins hetun. The following ཏུན begins with ཏ and does not change this syllable's sound."},{tib:"ཏུན",wylie:"tun",phon:"tun",note:"Root letter ཏ (ta) with vowel sign ུ (u) and the letter ན (na) as a syllable-closing suffix: 'tun'. Together ཧེ་ཏུན = 'hetun', the accusative of 'hetu' ('cause') — the cause that the Buddha declared. The following ཏེ begins with ཏ and does not change this syllable's sound."},{tib:"ཏེ",wylie:"te",phon:"te",note:"Root letter ཏ (ta) with vowel sign ེ (e): 'te'. Begins teṣāṃ, 'of those'. The following ཥཱཾ begins with ཥ and does not change this syllable's sound."},{tib:"ཥཱཾ",wylie:"ShAM",phon:"sham",note:"Root letter ཥ (ṣa — the retroflex sibilant, found only in Sanskrit) with the long-vowel sign ཱ (ā) and the anusvāra ཾ (the small circle above, nasalising the vowel to '-āṃ'): 'ṣāṃ'. Together ཏེ་ཥཱཾ = 'teṣāṃ', genitive plural 'of those (phenomena)', referring back to ye dharmā. The following ཏ begins tathāgata and does not change this syllable's sound."}]},{script:"ཏ་ཐཱ་ག་ཏོ",wylie:"ta thA ga to",phon:"Tathagato",gloss:"the Tathāgata",syllables:[{tib:"ཏ",wylie:"ta",phon:"ta",note:"Root letter ཏ (ta) with inherent vowel 'a': 'ta'. Begins tathāgata. The following ཐཱ begins with ཐ and does not change this syllable's sound."},{tib:"ཐཱ",wylie:"thA",phon:"tha",note:"The aspirate root letter ཐ (tha) with the long-vowel sign ཱ (ā): 'thā'. Together ཏ་ཐཱ = 'tathā', 'thus, in that way'. The following ག begins with ག and does not change this syllable's sound."},{tib:"ག",wylie:"ga",phon:"ga",note:"Root letter ག (ga) with inherent vowel 'a': 'ga'. The following ཏོ begins with ཏ and does not change this syllable's sound."},{tib:"ཏོ",wylie:"to",phon:"to",note:"Root letter ཏ (ta) with vowel sign ོ (o): 'to'. Together ཏ་ཐཱ་ག་ཏོ = 'tathāgato' — the Tathāgata (the Buddha's most formal epithet, meaning 'one who has thus gone/come'). The -o reflects the sandhi form of -taḥ before the following hy-. The following ཧྱ begins with ཧ and does not change this syllable's sound."}]},{script:"ཧྱ་བ་དཏ",wylie:"h+ya ba dat",phon:"Hya Badat",gloss:"has indeed declared",syllables:[{tib:"ཧྱ",wylie:"h+ya",phon:"hya",note:"Root letter ཧ (ha) with ཡ (ya) subjoined beneath it, giving the cluster 'hy': 'hya'. This transcribes the Sanskrit particle hi ('indeed, for') in its sandhi form hy- before a vowel, emphasising that the Tathāgata truly and authoritatively declared this teaching. The following བ begins with བ and does not change this syllable's sound."},{tib:"བ",wylie:"ba",phon:"ba",note:"Root letter བ (ba, representing Sanskrit 'v') with inherent vowel 'a': 'va'. The Tibetan blocks divide 'hy avadat' as hya-va-dat, so the a- of avadat (the augment marking past tense) is carried by the preceding ཧྱ, and this block gives the 'va'. The following དཏ begins with ད and does not change this syllable's sound."},{tib:"དཏ",wylie:"dat",phon:"dat",note:"Root letter ད (da) with inherent vowel 'a' and the letter ཏ (ta) as a suffix: 'dat'. Together ཧྱ་བ་དཏ = 'hy avadat', 'has indeed declared' (3rd-person singular imperfect of Sanskrit √vad, 'to speak/declare'; the imperfect denotes a completed, authoritative act). The following ཏེ begins the next phrase and does not change this syllable's sound."}]},{script:"ཏེ་ཥཱཾ་ཙ་ཡོ",wylie:"te ShAM tsa yo",phon:"Tesham Tsa Yo",gloss:"and the cessation of those",syllables:[{tib:"ཏེ",wylie:"te",phon:"te",note:"Root letter ཏ (ta) with vowel sign ེ (e): 'te'. Second occurrence of te- in teṣāṃ ('of those'). The following ཥཱཾ begins with ཥ and does not change this syllable's sound."},{tib:"ཥཱཾ",wylie:"ShAM",phon:"sham",note:"Same as above: retroflex ཥ (ṣa) with long ཱ (ā) and anusvāra ཾ (-āṃ): 'ṣāṃ'. Together ཏེ་ཥཱཾ = 'teṣāṃ', again genitive plural 'of those'. Here it refers to the cessation of those phenomena. The following ཙ begins with ཙ and does not change this syllable's sound."},{tib:"ཙ",wylie:"tsa",phon:"tsa",note:"Root letter ཙ (tsa) representing Sanskrit 'ca' ('and') with the inherent vowel 'a': 'ca'. The following ཡོ begins with ཡ and does not change this syllable's sound."},{tib:"ཡོ",wylie:"yo",phon:"yo",note:"Root letter ཡ (ya) with vowel sign ོ (o): 'yo', the sandhi form of Sanskrit yaḥ ('which', nominative singular relative pronoun). Together ཏེ་ཥཱཾ་ཙ་ཡོ = 'teṣāṃ ca yo', 'and that which is their cessation'. The following ནི begins nirodha and does not change this syllable's sound."}]},{script:"ནི་རོ་དྷ",wylie:"ni ro d+ha",phon:"Niro Dha",gloss:"cessation",syllables:[{tib:"ནི",wylie:"ni",phon:"ni",note:"Root letter ན (na) with vowel sign ི (i): 'ni'. The Sanskrit prefix ni- means 'down, back, into' and intensifies the following root. The following རོ begins with ར and does not change this syllable's sound."},{tib:"རོ",wylie:"ro",phon:"ro",note:"Root letter ར (ra) with vowel sign ོ (o): 'ro'. Together ནི་རོ = 'niro-', from Sanskrit ni + rodha (blocking/stopping). The following དྷ begins with ད and does not change this syllable's sound."},{tib:"དྷ",wylie:"d+ha",phon:"dha",note:"Root letter ད (da) with the aspiration mark ྷ subjoined: the voiced aspirate 'dha'. Together ནི་རོ་དྷ = 'nirodha', 'cessation' — the Sanskrit technical term for the Third Noble Truth, the cessation of suffering. Literally 'blocking off / stopping' (ni + √rudh 'to obstruct'). This is the goal of the path: independence from conditioned suffering. The following ཨེ begins evaṃ and does not change this syllable's sound."}]},{script:"ཨེ་བཾ་བཱ་དི",wylie:"e baM bA di",phon:"Ewam Badi",gloss:"thus teaches",syllables:[{tib:"ཨེ",wylie:"e",phon:"e",note:"The vowel-carrier letter ཨ (a-chen) with the vowel sign ེ (e): 'e'. Used to write a vowel that does not follow a consonant. Begins evaṃ, 'thus'. The following བཾ begins with བ and does not change this syllable's sound."},{tib:"བཾ",wylie:"baM",phon:"wam",note:"Root letter བ (ba, here representing Sanskrit 'v') with the anusvāra ཾ (nasalising to '-ṃ'): 'vaṃ'. Together ཨེ་བཾ = 'evaṃ', the Sanskrit adverb 'thus, in this way', marking the manner of the teaching that follows. The following བཱ begins with བ and does not change this syllable's sound."},{tib:"བཱ",wylie:"bA",phon:"wa",note:"Root letter བ (ba, for Sanskrit 'v') with the long-vowel sign ཱ (ā): 'vā'. Begins vādī, 'teacher/speaker'. The following དི begins with ད and does not change this syllable's sound."},{tib:"དི",wylie:"di",phon:"di",note:"Root letter ད (da) with vowel sign ི (i): 'di'. Together བཱ་དི = 'vādī', nominative singular of vādin ('one who speaks/teaches', from the same root √vad as avadat above). The verse thus rhymes its verb (avadat) and agent (vādī) from the same root. The following མ begins mahāśramaṇaḥ and does not change this syllable's sound."}]},{script:"མ་ཧཱ་ཤྲ་མ་ཎཿ",wylie:"ma hA sh+ra ma NaH",phon:"Maha Shramana",gloss:"the Great Śramaṇa",syllables:[{tib:"མ",wylie:"ma",phon:"ma",note:"Root letter མ (ma) with inherent vowel 'a': 'ma'. Begins mahā, 'great'. The following ཧཱ begins with ཧ and does not change this syllable's sound."},{tib:"ཧཱ",wylie:"hA",phon:"ha",note:"Root letter ཧ (ha) with the long-vowel sign ཱ (ā): 'hā'. Together མ་ཧཱ = 'mahā', 'great' (the Sanskrit intensifying prefix, only used in compounds). The following ཤྲ begins with ཤ and does not change this syllable's sound."},{tib:"ཤྲ",wylie:"sh+ra",phon:"shra",note:"Root letter ཤ (śa — the Sanskrit palatal sibilant, found only in Sanskrit loanwords) with ར (ra) subjoined beneath it, giving the cluster 'śr': 'śra'. This cluster begins śramaṇa. The following མ begins with མ and does not change this syllable's sound."},{tib:"མ",wylie:"ma",phon:"ma",note:"Root letter མ (ma) with inherent vowel 'a': 'ma'. The following ཎཿ begins with ཎ and does not change this syllable's sound."},{tib:"ཎཿ",wylie:"NaH",phon:"na",note:"The retroflex nasal ཎ (ṇa — found only in Sanskrit, not in native Tibetan words) with the visarga ཿ (two small dots marking the Sanskrit aspirated final '-ḥ'): 'ṇaḥ'. Together མ་ཧཱ་ཤྲ་མ་ཎཿ = 'mahāśramaṇaḥ', 'the Great Śramaṇa' — the Buddha's title as the supreme renunciant. This is the final syllable of the verse; there is no following syllable to affect it."}]}],wordGrouping:"Thirty-five Tibetan syllable-blocks group into nine units matching the Sanskrit words: Ye-dharmā (those phenomena) | Hetu-prabhavā (that arise from causes) | Hetun-teṣāṃ (their cause) | Tathāgato (the Tathāgata) | Hy-avadat (has indeed declared) | Teṣāṃ-ca-yo (and the cessation of those) | Nirodha (cessation) | Evaṃ-vādī (thus teaches) | Mahāśramaṇaḥ (the Great Śramaṇa). The verse moves in a precise arc: conditioned phenomena → their cause (declared by the Buddha) → their cessation → the teacher. Meditating on this sequence is itself the path to the independence (nirodha) the verse describes."}},{id:"shakyamuni-prayer",title:"Nyönmong Dü Kyi Dé Tsok Chom — Prayer to Śākyamuni",deity:"Śākyamuni Buddha",tags:["Shakyamuni","prayer","supplication","eight fears","native Tibetan","mantra of independence"],sanskrit:null,tibetan:{script:"ཉོན་མོངས་བདུད་ཀྱི་སྡེ་ཚོགས་བཅོམ། །བསོད་ནམས་ཡེ་ཤེས་ཕུང་པོར་ལྡན། །སྲིད་དང་ཞི་བའི་མཐའ་ལས་འདས། །ཤཱཀྱའི་ཐོག་ལ་གསོལ་བ་འདེབས། །འཇིགས་བརྒྱད་ཞི་བར་བྱིན་གྱིས་རློབས། །སྐྱེ་དང་ཚེ་རབས་ཐམས་ཅད་དུ། །ལར་ཡང་ལྷག་པའི་ལུས་ཐོབ་ནས། །འགྲོ་རྣམས་སྡུག་བསྔལ་ལས་སྒྲོལ་བའི། །བདེ་དཔོན་མཆོག་ཏུ་བདག་གྱུར་ཤོག །",wylie:"nyon mongs bdud kyi sde tshogs bcom / bsod nams ye shes phung por ldan / srid dang zhi ba'i mtha' las 'das / shAkya'i thog la gsol ba 'debs / 'jigs brgyad zhi bar byin gyis rlobs / skye dang tshe rabs thams cad du / lar yang lhag pa'i lus thob nas / 'gro rnams sdug bsngal las sgrol ba'i / bde dpon mchog tu bdag gyur shog",phonetic:"Nyönmong Dü Kyi Dé Tsok Chom, Sönam Yéshé Phungpor Den, Si Dang Zhiwé Ta Lé Dé, Shakyé Tok La Solwa Deb, Jikgyé Zhiwar Jingyi Lob, Kyé Dang Tsérab Tamché Du, Lar Yang Lhakpé Lu Tob Né, Dro Nam Dukngal Lé Drolwé, Dépön Chok Tu Dak Gyur Shok",translation:"Having vanquished the host of Māra's afflictions, / Endowed with the accumulations of merit and wisdom, / Gone beyond the extremes of existence and peace — / To the crown of the Śākyas, I pray: / Bless me to pacify the eight fears. / In all births and lifetimes, / Having again obtained an excellent body, / May I liberate beings from suffering / And become their supreme guide to happiness.",scriptType:"native-tibetan",intro:"This is a native Tibetan prayer of supplication (gsol 'debs) to Śākyamuni Buddha, distinct from the Sanskrit mantra Oṃ Muni Muni Mahāmuni already in this collection. It divides into two parts: the first four lines praise the Buddha's qualities (vanquishing Māra, possessing merit and wisdom, transcending both existence and nirvāṇa), and the last five lines express aspiration (to be blessed, to obtain a precious human body in future lives, and ultimately to liberate beings). Because this is composed in native Tibetan, ordinary reading rules apply throughout: silent prefix consonants (ག ད བ མ འ) shift tone and register; superscripts (ར ལ ས) raise register; the suffix ན fronts preceding vowels (o→ö, a→e); and the suffixes ག, ད, བ become unreleased final stops that shorten the vowel. One syllable — ཤཱཀྱའི (shakyé) — is the Sanskrit clan name Śākya written in Tibetan script with a long ā sign and the genitive particle འི; it follows Sanskrit-spelling conventions rather than native Tibetan reading rules.",lines:[{script:"ཉོན་མོངས་བདུད་ཀྱི་སྡེ་ཚོགས་བཅོམ",translit:"Nyönmong dü kyi dé tsok chom",gloss:"Having vanquished the host of Māra's afflictions",note:"ཉོན་མོངས (kleśa, 'afflictions') — the mental poisons (desire, aversion, ignorance and their derivatives). བདུད (Māra) — the demon who personifies death, temptation, and the forces opposing enlightenment; at the night of his enlightenment the Buddha 'vanquished' (བཅོམ, bcom) Māra's entire assembly (སྡེ་ཚོགས, 'host/army') by touching the earth as witness. ཀྱི is the genitive particle linking Māra to his army."},{script:"བསོད་ནམས་ཡེ་ཤེས་ཕུང་པོར་ལྡན",translit:"Sönam yéshé phungpor den",gloss:"Endowed with the accumulations of merit and wisdom",note:"The two accumulations (tshogs gnyis) are the foundation of Buddhahood: བསོད་ནམས (bsod nams, merit/puṇya) accumulated through ethical conduct and generosity, and ཡེ་ཤེས (ye shes, wisdom/jñāna) accumulated through meditation on emptiness. ཕུང་པོར (phung por, 'in/as heaps/aggregates', dative of ཕུང་པོ) means the Buddha holds these to a vast degree; ལྡན (ldan) = 'endowed with / possessing'."},{script:"སྲིད་དང་ཞི་བའི་མཐའ་ལས་འདས",translit:"Si dang zhiwé ta lé dé",gloss:"Gone beyond the extremes of existence and peace",note:"སྲིད (srid) = cyclic existence / saṃsāra; ཞི་བ (zhi ba) = peace / nirvāṇa. མཐའ (mtha') = extreme/limit. འདས ('das, past of 'da' ba) = 'gone beyond'. The Buddha is praised for transcending both ordinary worldly existence AND the 'quiescent' one-sided nirvāṇa of the śrāvakas — he dwells in mahāparinirvāṇa while remaining active for beings. ལས = the ablative particle 'from/beyond'."},{script:"ཤཱཀྱའི་ཐོག་ལ་གསོལ་བ་འདེབས",translit:"Shakyé tok la solwa deb",gloss:"To the crown of the Śākyas, I pray",note:"ཤཱཀྱའི (shākya'i) — the Sanskrit clan name Śākya (written in Tibetan with the long-ā sign ཱ and subjoined ྱ for the 'ky' cluster) plus the Tibetan genitive འི: 'of the Śākyas'. ཐོག (thog) = crown/pinnacle: 'the pinnacle of the Śākya clan' = the greatest person to arise from that royal lineage. གསོལ་བ་འདེབས (gsol ba 'debs) = 'to offer a supplication / to pray': the standard Tibetan liturgical phrase for petition, where 'debs means 'to place/offer'."},{script:"འཇིགས་བརྒྱད་ཞི་བར་བྱིན་གྱིས་རློབས",translit:"Jikgyé zhiwar jingyi lob",gloss:"Bless me to pacify the eight fears",note:"འཇིགས་བརྒྱད (the eight fears) — a classical list: lion, elephant, fire, snake, robbers, water, false imprisonment, and demons (different traditions enumerate them slightly differently). ཞི་བར (zhi bar) = 'to pacify/calm' (the dative/purposive ར: 'in order to calm'). བྱིན་གྱིས་རློབས (byin gyis rlobs) = the standard Tibetan formula for 'bless / empower': byin = gift/grace, gyis = instrumental, rlobs = command/empower."},{script:"སྐྱེ་དང་ཚེ་རབས་ཐམས་ཅད་དུ",translit:"Kyé dang tsérab tamché du",gloss:"In all births and lifetimes",note:"སྐྱེ (skye) = birth/rebirth; ཚེ་རབས (tshe rabs, 'all lives') — tshe = lifespan/life, rabs = series/sequence, together 'successive lifetimes'. ཐམས་ཅད (thams cad) = all/everything. དུ (du) = locative particle 'in/at'. This line opens the aspiration section: 'in all my future births and lives [may the following come to pass]'."},{script:"ལར་ཡང་ལྷག་པའི་ལུས་ཐོབ་ནས",translit:"Lar yang lhakpé lu tob né",gloss:"Having again obtained an excellent body",note:"ལར་ཡང (lar yang) = 'again, once more' (a set phrase). ལྷག་པ (lhag pa) = superior/excellent/special; with genitive འི: 'of excellence'. ལུས (lus) = body — here 'a precious human body' endowed with the freedoms and opportunities for practice. ཐོབ་ནས (thob nas) = 'having obtained' (ནས is the connective particle linking to the following aspiration)."},{script:"འགྲོ་རྣམས་སྡུག་བསྔལ་ལས་སྒྲོལ་བའི",translit:"Dro nam dukngal lé drolwé",gloss:"May I liberate beings from suffering",note:"འགྲོ་རྣམས ('gro rnams) = sentient beings: 'gro (those who wander/go) + rnams (plural particle). སྡུག་བསྔལ (sdug bsngal) = suffering / duḥkha — the central term of the First Noble Truth. ལས (las) = ablative 'from'. སྒྲོལ་བའི (sgrol ba'i) = 'of liberating' (genitive: this line is a genitive phrase modifying the leader of the next line): '(the) liberating of beings from suffering'."},{script:"བདེ་དཔོན་མཆོག་ཏུ་བདག་གྱུར་ཤོག",translit:"Dépön chok tu dak gyur shok",gloss:"May I become the supreme guide to happiness",note:"བདེ་དཔོན (bde dpon) = 'guide/leader of happiness' — bde = bliss/happiness, dpon = lord/leader/guide. མཆོག་ཏུ (mchog tu) = 'as the supreme / supremely'. བདག (bdag) = I/myself (the practitioner). གྱུར (gyur) = 'become' (past stem used in optative constructions). ཤོག (shog) = the optative/wishful particle 'may it be so!' that closes Tibetan aspirational prayers. The whole prayer ends: 'may I become the supreme guide leading beings to happiness'."}],words:[{script:"ཉོན་མོངས་བདུད་ཀྱི་སྡེ་ཚོགས་བཅོམ",wylie:"nyon mongs bdud kyi sde tshogs bcom",phon:"Nyönmong Dü Kyi Dé Tsok Chom",gloss:"having vanquished the host of Māra's afflictions",syllables:[{tib:"ཉོན",wylie:"nyon",phon:"nyön",note:"Root letter ཉ (nya) with the vowel sign ོ (o) and suffix ན. The suffix ན fronts the vowel: o → ö, giving 'nyön'. No prefix; ཉ is a low-register consonant, so the syllable has a low/level tone. Begins nyon mongs, 'afflictions/kleśas'."},{tib:"མོངས",wylie:"mongs",phon:"mong",note:"Root letter མ (ma) with the vowel sign ོ (o), suffix ང, and a secondary suffix ས. The suffix ང does not front the vowel (unlike ན), so the vowel stays 'o': 'mong'. The secondary suffix ས is a grammatical plural/agent marker, barely heard in speech. Together ཉོན་མོངས = 'nyon mongs', the Tibetan rendering of Sanskrit kleśa ('afflictions'). The following བདུད begins with བ and does not change this syllable's sound."},{tib:"བདུད",wylie:"bdud",phon:"dü",note:"Prefix བ (silent; raises the register of the following syllable to high/falling tone) + root ད (da) with vowel ུ (u) + suffix ད (unreleased -t stop, closing and shortening the vowel). The prefix བ on voiced root ད devoices and raises it to high register: 'dü' (high falling tone). Means Māra, the 'demon' of death and temptation. The following ཀྱི begins with ཀ and does not change this syllable's sound."},{tib:"ཀྱི",wylie:"kyi",phon:"kyi",note:"Root letter ཀ (ka) with ཡ (ya) subjoined beneath it — the cluster ཀྱ — plus the vowel sign ི (i): 'kyi'. No prefix; ཀ is a high-register consonant. This is the genitive particle 'kyi', linking Māra (བདུད) to his army (སྡེ་ཚོགས). The following སྡེ begins with ས and does not change this syllable's sound."},{tib:"སྡེ",wylie:"sde",phon:"dé",note:"Superscript ས (sa-mgo, silent) above root ད (da), with vowel ེ (e), no suffix. The superscript ས raises the voiced ད to high register: 'dé' (high tone). Means 'host, division, assembly'. The following ཚོགས begins with ཚ and does not change this syllable's sound."},{tib:"ཚོགས",wylie:"tshogs",phon:"tsok",note:"Root letter ཚ (tsha, aspirated affricate) with the vowel sign ོ (o) and suffix གས (ག + ས). The suffix ག closes the syllable as an unreleased -k stop and shortens the vowel; the ས is a secondary grammatical suffix: 'tsok'. Together སྡེ་ཚོགས = 'host/army/retinue'. The following བཅོམ begins with བ and does not change this syllable's sound."},{tib:"བཅོམ",wylie:"bcom",phon:"chom",note:"Prefix བ (silent; raises register) + root ཅ (ca, the palatal affricate) with vowel ོ (o) + suffix མ (final -m). The prefix བ on ཅ raises it to high register and devoices it to a more aspirated/sharp 'ch': 'chom'. This is the past tense of འཇོམས ('joms), 'to vanquish/defeat': 'having vanquished'. The following བསོད begins a new line and does not change this syllable's sound."}]},{script:"བསོད་ནམས་ཡེ་ཤེས་ཕུང་པོར་ལྡན",wylie:"bsod nams ye shes phung por ldan",phon:"Sönam Yéshé Phungpor Den",gloss:"endowed with the accumulations of merit and wisdom",syllables:[{tib:"བསོད",wylie:"bsod",phon:"söd",note:"Prefix བ (silent; raises register) + root ས (sa) with vowel ོ (o) + suffix ད. The prefix བ raises register; suffix ད closes as unreleased -t and slightly shortens the vowel, giving 'söd' (or 'sö' in fluent speech before the following ནམས). The following ནམས begins with ན and does not change this syllable's sound."},{tib:"ནམས",wylie:"nams",phon:"nam",note:"Root letter ན (na) with inherent vowel 'a', suffix མ, secondary suffix ས. The secondary ས is a grammatical marker, barely heard; the syllable is 'nam'. Together བསོད་ནམས = 'sönam' = merit (Sanskrit puṇya), one of the two accumulations required for Buddhahood. The following ཡེ begins with ཡ and does not change this syllable's sound."},{tib:"ཡེ",wylie:"ye",phon:"yé",note:"Root letter ཡ (ya) with the vowel sign ེ (e): 'yé'. No prefix; ཡ is a low-register consonant. Begins ye shes, 'primordial wisdom' (Sanskrit jñāna). The following ཤེས begins with ཤ and does not change this syllable's sound."},{tib:"ཤེས",wylie:"shes",phon:"shé",note:"Root letter ཤ (sha, the palatal sibilant — used in both Sanskrit and native Tibetan words) with the vowel sign ེ (e) and suffix ས. The suffix ས is a grammatical marker here; the syllable is 'shé'. Together ཡེ་ཤེས = 'yéshé' = primordial wisdom/awareness (the direct, non-conceptual knowing that perceives reality). The following ཕུང begins with ཕ and does not change this syllable's sound."},{tib:"ཕུང",wylie:"phung",phon:"phung",note:"Root letter ཕ (pha, aspirated bilabial) with the vowel sign ུ (u) and suffix ང: 'phung'. No prefix; ཕ is naturally high register. Means 'heap/aggregate/accumulation' (Sanskrit skandha). The following པོར begins with པ and does not change this syllable's sound."},{tib:"པོར",wylie:"por",phon:"por",note:"Root letter པ (pa) with the vowel sign ོ (o) and suffix ར. The suffix ར functions here as a dative/locative marker: 'in/as heaps'. Together ཕུང་པོར = 'phungpor', 'in the accumulations / as aggregates of'. The following ལྡན begins with ལ and does not change this syllable's sound."},{tib:"ལྡན",wylie:"ldan",phon:"den",note:"Superscript ལ (la-mgo, silent) above root ད (da), with inherent vowel 'a' + suffix ན. The suffix ན fronts the vowel: a → e, giving 'den'. The superscript ལ raises the register (high tone). Means 'endowed with / possessing' — a common Tibetan verb of attribution. The following སྲིད begins a new line and does not change this syllable's sound."}]},{script:"སྲིད་དང་ཞི་བའི་མཐའ་ལས་འདས",wylie:"srid dang zhi ba'i mtha' las 'das",phon:"Si Dang Zhiwé Ta Lé Dé",gloss:"gone beyond the extremes of existence and peace",syllables:[{tib:"སྲིད",wylie:"srid",phon:"si",note:"Root letter ས (sa) with ར (ra) subjoined beneath it (ra-btags), vowel ི (i) and suffix ད. In the cluster སྲ the subjoined ར is silent in Central Tibetan, leaving a high-register 's'; the suffix ད closes as an unreleased stop, giving 'si' (or 'sit' when clearly pronounced). Means 'existence / cyclic existence / saṃsāra'. The following དང begins with ད and does not change this syllable's sound."},{tib:"དང",wylie:"dang",phon:"dang",note:"Root letter ད (da) with inherent vowel 'a' and suffix ང: 'dang'. No prefix. This is the Tibetan conjunction 'and'. The following ཞི begins with ཞ and does not change this syllable's sound."},{tib:"ཞི",wylie:"zhi",phon:"zhi",note:"Root letter ཞ (zha, the voiced palatal fricative) with the vowel sign ི (i): 'zhi'. No prefix; ཞ is low register. Begins zhi ba, 'peace / stillness / nirvāṇa'. The following བའི begins with བ and does not change this syllable's sound."},{tib:"བའི",wylie:"ba'i",phon:"wé",note:"Root letter བ (ba) with inherent vowel 'a' and the genitive suffix འི ('i): 'ba'i', pronounced 'wé' in Central Tibetan (the བ between vowels is lenited to a 'w' sound; the འི adds the high front vowel making -wé). Together ཞི་བའི = 'zhiwé', genitive of 'peace': 'of peace / of nirvāṇa'. The following མཐའ begins with མ and does not change this syllable's sound."},{tib:"མཐའ",wylie:"mtha'",phon:"ta",note:"Prefix མ (silent; raises register) + root ཐ (tha, the aspirated dental) with inherent vowel 'a' + suffix འ (the glottal stop marker, which lengthens or darkens the final vowel). The prefix མ before the aspirate ཐ gives a high register 'th'; the འ suffix gives a slight falling/lengthened quality to the vowel: 'ta' (aspirated). Means 'extreme / limit / boundary'. The following ལས begins with ལ and does not change this syllable's sound."},{tib:"ལས",wylie:"las",phon:"lé",note:"Root letter ལ (la) with inherent vowel 'a' and suffix ས: 'las', pronounced 'lé' in Central Tibetan (the ས suffix shifts the vowel forward). This is the ablative case particle 'from / beyond'. The following འདས begins with འ and does not change this syllable's sound."},{tib:"འདས",wylie:"'das",phon:"dé",note:"Prefix འ (silent; lowers the register to low/rising tone) + root ད (da) with inherent vowel 'a' + suffix ས. The prefix འ before voiced ད keeps it low register; the ས suffix shifts the vowel forward to 'e': 'dé' (low tone). This is the past tense of འདའ་བ ('da' ba), 'to pass beyond / transcend': 'gone beyond'. The following ཤཱཀྱའི begins a new line and does not change this syllable's sound."}]},{script:"ཤཱཀྱའི་ཐོག་ལ་གསོལ་བ་འདེབས",wylie:"shAkya'i thog la gsol ba 'debs",phon:"Shakyé Tok La Solwa Deb",gloss:"to the crown of the Śākyas, I pray",syllables:[{tib:"ཤཱཀྱའི",wylie:"shAkya'i",phon:"shakyé",note:"The Sanskrit clan name Śākya written in Tibetan script with Sanskrit-spelling conventions: ཤ (śa, the palatal sibilant) with the long-vowel sign ཱ (ā), then ཀ (ka) with subjoined ྱ (ya) forming the cluster 'kya', followed by the native Tibetan genitive suffix འི (pronounced 'é' in Central Tibetan). Together: 'of the Śākyas'. This is the only syllable in the prayer that uses Sanskrit-spelling rules rather than native Tibetan reading rules. The following ཐོག begins with ཐ and does not change this syllable's sound."},{tib:"ཐོག",wylie:"thog",phon:"tok",note:"Root letter ཐ (tha, aspirated dental) with the vowel sign ོ (o) and suffix ག. The suffix ག closes as an unreleased -k stop and shortens the vowel: 'tok'. No prefix; ཐ is high register. Means 'top / crown / pinnacle'; ཤཱཀྱའི་ཐོག = 'the crown of the Śākyas' = the greatest person of the Śākya clan. The following ལ begins with ལ and does not change this syllable's sound."},{tib:"ལ",wylie:"la",phon:"la",note:"Root letter ལ (la) with inherent vowel 'a': 'la'. The dative particle 'to / at / toward', directing the supplication. The following གསོལ begins with ག and does not change this syllable's sound."},{tib:"གསོལ",wylie:"gsol",phon:"sol",note:"Prefix ག (silent; raises register) + root ས (sa) with vowel ོ (o) + suffix ལ. The prefix ག before ས raises it to high/aspirated register: 'sol' (high tone). Begins gsol ba, the honorific term for 'to speak / to offer / to supplicate' — used specifically when addressing those of higher status (deities, teachers). The following བ begins with བ and does not change this syllable's sound."},{tib:"བ",wylie:"ba",phon:"wa",note:"Root letter བ (ba) with inherent vowel 'a': 'ba', pronounced 'wa' in Central Tibetan when following a vowel (the བ is lenited between vowels). Together གསོལ་བ = 'solwa', the noun/verb of supplication: 'a prayer / to offer a supplication'. The following འདེབས begins with འ and does not change this syllable's sound."},{tib:"འདེབས",wylie:"'debs",phon:"deb",note:"Prefix འ (silent; low register) + root ད (da) with vowel ེ (e) + suffix བ, secondary suffix ས. The prefix འ keeps ད in low register: 'deb' (low tone; the secondary ས is barely heard). འདེབས means 'to offer / to place / to press against'; in the phrase གསོལ་བ་འདེབས it means 'I offer a supplication / I pray'. This closes the praising section; the following འཇིགས begins the request. The following འཇིགས begins a new line and does not change this syllable's sound."}]},{script:"འཇིགས་བརྒྱད་ཞི་བར་བྱིན་གྱིས་རློབས",wylie:"'jigs brgyad zhi bar byin gyis rlobs",phon:"Jikgyé Zhiwar Jingyi Lob",gloss:"bless me to pacify the eight fears",syllables:[{tib:"འཇིགས",wylie:"'jigs",phon:"jik",note:"Prefix འ (silent; low register) + root ཇ (ja, the voiced palatal affricate) with vowel ི (i) + suffix གས (ག + secondary ས). The suffix ག closes as unreleased -k; the secondary ས is grammatical: 'jik' (low tone from prefix འ). Means 'fears / terrors'. The following བརྒྱད begins with བ and does not change this syllable's sound."},{tib:"བརྒྱད",wylie:"brgyad",phon:"gyé",note:"Prefix བ (silent; high register) + superscript ར above root ག, giving the cluster རག, with subjoined ྱ (ya) below ག, making a three-consonant stack རྒྱ, plus inherent vowel 'a' and suffix ད. The combined prefixes (བ + superscript ར) raise to high register; the subjoined ྱ palatalises the cluster; suffix ད closes as unreleased stop and shifts the vowel forward to 'e': 'gyé' (high tone). Means 'eight'. Together འཇིགས་བརྒྱད = 'jikgyé', the eight fears. The following ཞི begins with ཞ and does not change this syllable's sound."},{tib:"ཞི",wylie:"zhi",phon:"zhi",note:"Root letter ཞ (zha) with vowel ི (i): 'zhi'. Low register (ཞ is a voiced fricative). Begins zhi bar, 'to pacify'. The following བར begins with བ and does not change this syllable's sound."},{tib:"བར",wylie:"bar",phon:"war",note:"Root letter བ (ba) with inherent vowel 'a' and suffix ར. The suffix ར here is the dative/purposive marker: 'in order to / for the sake of'; བར is pronounced 'war' (the བ is lenited to 'w' between vowels). Together ཞི་བར = 'zhiwar', 'to pacify / in order to calm'. The following བྱིན begins with བ and does not change this syllable's sound."},{tib:"བྱིན",wylie:"byin",phon:"jin",note:"Root letter བ (ba) with subjoined ྱ (ya) forming the cluster བྱ, plus the vowel sign ི (i) and suffix ན. The subjoined ྱ palatalises བ, making 'bya-'; the vowel ི gives 'byi-'; the suffix ན fronts the vowel: i is already front so the effect is minimal — the syllable is 'jin'. Means 'gift / grace / blessing'. The following གྱིས begins with ག and does not change this syllable's sound."},{tib:"གྱིས",wylie:"gyis",phon:"gyi",note:"Root letter ག (ga) with subjoined ྱ (ya) and the vowel sign ི (i), plus suffix ས. The subjoined ྱ palatalises the cluster to 'gy-'; suffix ས is a grammatical instrumental marker: 'gyis'. Together བྱིན་གྱིས (byin gyis) is the standard Tibetan instrumental construction: 'by means of blessing / by grace'. The following རློབས begins with ར and does not change this syllable's sound."},{tib:"རློབས",wylie:"rlobs",phon:"lob",note:"Superscript ར above root ལ (la) — the cluster རལ — with the vowel sign ོ (o) and suffix བས (བ + secondary ས). The superscript ར raises the register to high/falling tone; suffix བ closes as unreleased -p (or soft -b) and the secondary ས is grammatical: 'lob' (high tone). This is the imperative/optative of rlob pa, 'to empower / bless / grant': 'bless! empower!' The full phrase བྱིན་གྱིས་རློབས = 'byin gyis rlobs' is the standard Tibetan liturgical formula for 'bless me / grant blessings'. The following སྐྱེ begins a new line and does not change this syllable's sound."}]},{script:"སྐྱེ་དང་ཚེ་རབས་ཐམས་ཅད་དུ",wylie:"skye dang tshe rabs thams cad du",phon:"Kyé Dang Tsérab Tamché Du",gloss:"in all births and lifetimes",syllables:[{tib:"སྐྱེ",wylie:"skye",phon:"kyé",note:"Superscript ས (sa-mgo, silent) above root ཀ (ka), with subjoined ྱ (ya) and the vowel sign ེ (e), no suffix — a three-letter stack སྐྱ. The superscript ས raises register; the subjoined ྱ palatalises the cluster to 'ky-': 'kyé' (high tone). Means 'birth / rebirth / to arise'. The following དང begins with ད and does not change this syllable's sound."},{tib:"དང",wylie:"dang",phon:"dang",note:"Root letter ད (da) with inherent vowel 'a' and suffix ང: 'dang'. The conjunction 'and'. The following ཚེ begins with ཚ and does not change this syllable's sound."},{tib:"ཚེ",wylie:"tshe",phon:"tsé",note:"Root letter ཚ (tsha, the aspirated affricate) with the vowel sign ེ (e): 'tshé'. No prefix; ཚ is high register. Means 'lifespan / life'. Begins tshe rabs, 'lifetimes'. The following རབས begins with ར and does not change this syllable's sound."},{tib:"རབས",wylie:"rabs",phon:"rab",note:"Root letter ར (ra) with inherent vowel 'a', suffix བ, secondary suffix ས. The suffix བ closes as unreleased -p; the ས is grammatical: 'rab'. Means 'series / sequence / successive'; ཚེ་རབས = 'tshe rabs' = 'successive lifetimes / all lives'. The following ཐམས begins with ཐ and does not change this syllable's sound."},{tib:"ཐམས",wylie:"thams",phon:"tam",note:"Root letter ཐ (tha, aspirated dental) with inherent vowel 'a', suffix མ, secondary suffix ས. The ས is grammatical; suffix མ closes as -m: 'tam'. ཐ is high register. Begins thams cad, 'all / every'. The following ཅད begins with ཅ and does not change this syllable's sound."},{tib:"ཅད",wylie:"cad",phon:"ché",note:"Root letter ཅ (ca, the palatal affricate) with inherent vowel 'a' and suffix ད. The suffix ད closes as unreleased stop and shifts the vowel forward to 'e': 'ché' in Central Tibetan. Together ཐམས་ཅད = 'tamché', 'all / every / in all'. The following དུ begins with ད and does not change this syllable's sound."},{tib:"དུ",wylie:"du",phon:"du",note:"Root letter ད (da) with the vowel sign ུ (u): 'du'. The locative/dative particle 'in / at / to': 'in all births and lifetimes'. The following ལར begins a new line and does not change this syllable's sound."}]},{script:"ལར་ཡང་ལྷག་པའི་ལུས་ཐོབ་ནས",wylie:"lar yang lhag pa'i lus thob nas",phon:"Lar Yang Lhakpé Lu Tob Né",gloss:"having again obtained an excellent body",syllables:[{tib:"ལར",wylie:"lar",phon:"lar",note:"Root letter ལ (la) with inherent vowel 'a' and suffix ར. The suffix ར here is a directional/ablative marker: 'returning to / back'. Together ལར་ཡང (lar yang) is a set phrase meaning 'again / once more / in return'. The following ཡང begins with ཡ and does not change this syllable's sound."},{tib:"ཡང",wylie:"yang",phon:"yang",note:"Root letter ཡ (ya) with inherent vowel 'a' and suffix ང: 'yang'. Low register (ཡ is a voiced semi-vowel). Means 'also / again / moreover'. Together ལར་ཡང = 'lar yang', 'once again'. The following ལྷག begins with ལ and does not change this syllable's sound."},{tib:"ལྷག",wylie:"lhag",phon:"lhak",note:"The special two-letter combination ལྷ (la + ha written together, giving the aspirated lateral 'lh-', a breathy or aspirated 'l' sound distinctive in Tibetan) with inherent vowel 'a' and suffix ག. The suffix ག closes as unreleased -k: 'lhak'. No prefix; ལྷ is high register. Means 'superior / excellent / remaining'. The following པའི begins with པ and does not change this syllable's sound."},{tib:"པའི",wylie:"pa'i",phon:"pé",note:"Root letter པ (pa) with inherent vowel 'a' and the genitive suffix འི ('i): 'pa'i', pronounced 'pé' (the འི draws the vowel forward to 'e'). Together ལྷག་པའི = 'lhakpé', genitive of 'excellence': 'of/characterized by excellence'. The following ལུས begins with ལ and does not change this syllable's sound."},{tib:"ལུས",wylie:"lus",phon:"lü",note:"Root letter ལ (la) with the vowel sign ུ (u) and suffix ས. The suffix ས here is a grammatical marker; the syllable is 'lü' (or 'lu'). Means 'body' — here 'a precious human body endowed with the freedoms and opportunities for Dharma practice'. The following ཐོབ begins with ཐ and does not change this syllable's sound."},{tib:"ཐོབ",wylie:"thob",phon:"tob",note:"Root letter ཐ (tha, aspirated) with the vowel sign ོ (o) and suffix བ. Suffix བ closes as unreleased -p: 'tob' (or 'top'). High register (ཐ aspirate). Means 'to obtain / to gain / to attain'. The following ནས begins with ན and does not change this syllable's sound."},{tib:"ནས",wylie:"nas",phon:"né",note:"Root letter ན (na) with inherent vowel 'a' and suffix ས: 'nas', pronounced 'né' (the ས shifts the vowel forward). This is the ablative/connective particle 'having / from / after': 'having obtained'. It links this line to the aspiration that follows. The following འགྲོ begins a new line and does not change this syllable's sound."}]},{script:"འགྲོ་རྣམས་སྡུག་བསྔལ་ལས་སྒྲོལ་བའི",wylie:"'gro rnams sdug bsngal las sgrol ba'i",phon:"Dro Nam Dukngal Lé Drolwé",gloss:"may I liberate beings from suffering",syllables:[{tib:"འགྲོ",wylie:"'gro",phon:"dro",note:"Prefix འ (silent; low register) + root ག (ga) with subjoined ར (ra) forming the cluster གྲ, plus the vowel sign ོ (o), no suffix. The prefix འ keeps the cluster in low register: 'dro' (low tone). Means 'to wander / to go'; འགྲོ་བ ('gro ba) = 'sentient beings / wanderers in saṃsāra'. The following རྣམས begins with ར and does not change this syllable's sound."},{tib:"རྣམས",wylie:"rnams",phon:"nam",note:"Superscript ར above root ན (na), with inherent vowel 'a', suffix མ, secondary suffix ས. The superscript ར raises register to high/falling tone; suffix མ closes as -m; ས is grammatical: 'nam'. This is the Tibetan plural particle — it does not add meaning by itself but marks the preceding noun as plural. Together འགྲོ་རྣམས = 'dro nam', 'all sentient beings'. The following སྡུག begins with ས and does not change this syllable's sound."},{tib:"སྡུག",wylie:"sdug",phon:"duk",note:"Superscript ས (sa-mgo, silent) above root ད (da), with the vowel sign ུ (u) + suffix ག. The superscript ས raises register; suffix ག closes as unreleased -k: 'duk' (high tone). Means 'suffering / painful / distressing'. The following བསྔལ begins with བ and does not change this syllable's sound."},{tib:"བསྔལ",wylie:"bsngal",phon:"ngal",note:"Prefix བ (silent) + superscript ས above root ང (nga), with inherent vowel 'a' and suffix ལ. Both prefix བ and superscript ས affect register (raising); suffix ལ closes as -l: 'ngal'. Together སྡུག་བསྔལ = 'dukngal' = suffering / duḥkha — the central term of the First Noble Truth, often understood as 'the painful suffering of body and mind'. The following ལས begins with ལ and does not change this syllable's sound."},{tib:"ལས",wylie:"las",phon:"lé",note:"Root letter ལ (la) with inherent vowel 'a' and suffix ས: 'las', pronounced 'lé'. The ablative particle 'from': 'from suffering'. The following སྒྲོལ begins with ས and does not change this syllable's sound."},{tib:"སྒྲོལ",wylie:"sgrol",phon:"drol",note:"Superscript ས (sa-mgo, silent) above root ག (ga), with ར (ra) subjoined beneath it (ra-btags), the vowel sign ོ (o) and suffix ལ — a three-letter stack སྒྲ. The superscript ས raises register; the subjoined ར turns ག into a retroflex 'dr'; suffix ལ closes as -l: 'drol' (high tone). Means 'to liberate / to free / to deliver'. The following བའི begins with བ and does not change this syllable's sound."},{tib:"བའི",wylie:"ba'i",phon:"wé",note:"Root letter བ (ba) with inherent vowel 'a' and genitive suffix འི: 'ba'i', pronounced 'wé'. Together སྒྲོལ་བའི = 'drolwé', genitive of 'liberation': 'of liberating / for liberating'. This whole line is a genitive phrase modifying the 'guide' in the final line: '[the guide] of liberating beings from suffering'. The following བདེ begins a new line and does not change this syllable's sound."}]},{script:"བདེ་དཔོན་མཆོག་ཏུ་བདག་གྱུར་ཤོག",wylie:"bde dpon mchog tu bdag gyur shog",phon:"Dépön Chok Tu Dak Gyur Shok",gloss:"may I become the supreme guide to happiness",syllables:[{tib:"བདེ",wylie:"bde",phon:"dé",note:"Prefix བ (silent; raises register) + root ད (da) with the vowel sign ེ (e), no suffix. The prefix བ on voiced ད raises it to high register: 'dé' (high tone). Means 'happiness / bliss / ease' (Sanskrit sukha). The following དཔོན begins with ད and does not change this syllable's sound."},{tib:"དཔོན",wylie:"dpon",phon:"pön",note:"Prefix ད (silent; raises register) + root པ (pa) with the vowel sign ོ (o) + suffix ན. The prefix ད before unvoiced པ raises it to high/aspirated register; suffix ན fronts the vowel: o → ö: 'pön' (high tone). Means 'leader / lord / guide / master'. Together བདེ་དཔོན = 'dépön', 'guide to happiness / leader toward bliss'. The following མཆོག begins with མ and does not change this syllable's sound."},{tib:"མཆོག",wylie:"mchog",phon:"chok",note:"Prefix མ (silent; raises register) + root ཆ (cha, the aspirated palatal affricate) with the vowel sign ོ (o) + suffix ག. The prefix མ before aspirate ཆ keeps it high register; suffix ག closes as unreleased -k: 'chok'. Means 'supreme / excellent / the best / highest'. The following ཏུ begins with ཏ and does not change this syllable's sound."},{tib:"ཏུ",wylie:"tu",phon:"tu",note:"Root letter ཏ (ta) with the vowel sign ུ (u): 'tu'. No prefix; ཏ is high register. This is the dative/equative particle 'as / in the capacity of / supremely': 'as the supreme guide'. The following བདག begins with བ and does not change this syllable's sound."},{tib:"བདག",wylie:"bdag",phon:"dak",note:"Prefix བ (silent; raises register) + root ད (da) with inherent vowel 'a' + suffix ག. The prefix བ raises register; suffix ག closes as unreleased -k: 'dak' (high tone). Means 'I / myself / the self' — here the practitioner expressing the aspiration in the first person. The following གྱུར begins with ག and does not change this syllable's sound."},{tib:"གྱུར",wylie:"gyur",phon:"gyur",note:"Root letter ག (ga) with subjoined ྱ (ya) and the vowel sign ུ (u), suffix ར. The subjoined ྱ palatalises the cluster to 'gy-': 'gyur'. No prefix; ག is low register in its base form. Means 'to become / became'; used in optative/aspirational constructions: 'may (I) become'. The following ཤོག begins with ཤ and does not change this syllable's sound."},{tib:"ཤོག",wylie:"shog",phon:"shok",note:"Root letter ཤ (sha) with the vowel sign ོ (o) and suffix ག. Suffix ག closes as unreleased -k: 'shok'. ཤ is high register. This is the optative/wishful particle — the standard way to close aspirational prayers in Tibetan, equivalent to 'may it be so!' or 'let it come to pass!'. The prayer ends here; there is no following syllable."}]}],wordGrouping:"Sixty-two Tibetan syllable-blocks across nine lines form two sections: a four-line praise of Śākyamuni's qualities (lines 1–4: vanquishing Māra, possessing the two accumulations, transcending extremes, the supplication itself) and a five-line aspiration (lines 5–9: pacify the eight fears; in future lives obtain an excellent body; liberate beings from suffering; become the supreme guide to happiness). The final two lines are syntactically linked — line 8 (of liberating beings from suffering) is a genitive modifying line 9's 'supreme guide' — so the last aspiration reads together: 'may I become the supreme guide who liberates beings from suffering to happiness'."}},{id:"five-element-purification",title:"Oṃ Āḥ Hūṃ — Five Element Purification Mantra",deity:"Five Dhyāni Buddhas / Five Elements",tags:["purification","five elements","Om Ah Hung","seed syllables","space","wind","water","fire","earth","Vajrayana"],sanskrit:null,tibetan:{script:"ༀ་ཨཱཿ་ཧཱུྃ། ཨེ་ཡཾ་ཀཾ་རཾ་ལཾ། ཤུདྡྷེ་ཤུདྡྷེ། ཨ་ཨ།",wylie:"oM AH hUM e yaM kaM raM laM shud+d+he shud+d+he a a",phonetic:"Om Ah Hung E Yam Kam Ram Lam Shudde Shudde A A",translation:"Oṃ Āḥ Hūṃ — Space Wind Water Fire Earth — Purify! Purify! — A A",scriptType:"sanskrit-in-tibetan",intro:"This mantra is Sanskrit written in Tibetan script, following the same 'Sanskrit-spelling' conventions as Om Mani Padme Hum. None of the ordinary Tibetan reading rules (silent prefixes, vowel fronting, register shifts) apply — every syllable is a Sanskrit bīja read in its Sanskrit form. Special features: ༀ is the dedicated Tibetan OM glyph; ཨཱཿ uses the long-ā sign ཱ and the Tibetan visarga ཿ; ཧཱུྃ uses the long-ū sign ཱུ and the Tibetan anusvāra ྃ; each element seed syllable (ཡཾ, ཀཾ, རཾ, ལཾ) uses the anusvāra ཾ for the Sanskrit ṃ; and ཤུདྡྷེ contains the stack དྡྷ (as in སིདྡྷི, siddhi) used only for the Sanskrit geminate aspirate ddh, which does not exist in native Tibetan phonology.",words:[{script:"ༀ་ཨཱཿ་ཧཱུྃ",wylie:"oM AH hUM",phon:"Om Āḥ Hūṃ",gloss:"body, speech, and mind of all Buddhas",syllables:[{tib:"ༀ",wylie:"oM",phon:"om",note:"The dedicated Tibetan OM glyph (ༀ), a ligature of the Sanskrit AUM written in a stylized Tibetan form. It does not follow normal Tibetan consonant or vowel rules — it is always read 'oṃ'. In tantric Buddhism it represents the body of all Buddhas and the purification of physical actions. It is the first of the three vajras."},{tib:"ཨཱཿ",wylie:"AH",phon:"āḥ",note:"The letter ཨ (the Tibetan vowel carrier, used when a syllable begins with a vowel) with the long-ā sign ཱ (making ā) and the Tibetan visarga ཿ (representing the Sanskrit ḥ, an aspirated breath-release after the vowel). Together: 'Āḥ'. The visarga ཿ appears only in Sanskrit-spelling mode — it has no counterpart in native Tibetan phonology. This is the seed syllable of speech, representing the purification of speech."},{tib:"ཧཱུྃ",wylie:"hUM",phon:"hūṃ",note:"The letter ཧ (ha) with the long-ū sign ཱུ (a combination of the long-ā sign ཱ and the u-sign ུ stacked together) and the Tibetan anusvāra ྃ (representing the Sanskrit ṃ, a resonant nasal vibration). Together: 'Hūṃ'. This is the indestructible seed syllable of the mind, the blue-black syllable of Akṣobhya and Vajrasattva. It represents the purification of mental actions."}]},{script:"ཨེ",wylie:"e",phon:"e",gloss:"space (ākāśa)",syllables:[{tib:"ཨེ",wylie:"e",phon:"e",note:"The Tibetan vowel carrier ཨ with the e-sign ེ. In Sanskrit-spelling mode this is simply the vowel 'e' (pronounced like English 'ay'). Tibetan has no independent vowel letters for e or o — ཨ with the vowel sign is the standard way to render a Sanskrit syllable beginning with a vowel other than 'a'. E is the seed syllable of the space element (ākāśa), the open, all-pervading ground in which the other four elements arise."}]},{script:"ཡཾ",wylie:"yaM",phon:"yaṃ",gloss:"wind / air element (vāyu)",syllables:[{tib:"ཡཾ",wylie:"yaM",phon:"yaṃ",note:"The letter ཡ (ya, the Sanskrit semi-vowel/glide) with the Tibetan anusvāra ཾ (a small subscript circle representing the Sanskrit ṃ, a resonant nasal vibration with no fixed place of articulation). Read 'yaṃ' — not as native Tibetan 'ya' which would have no anusvāra. Yaṃ is the seed syllable of the wind/air element (vāyu), associated with movement, breath, and the vital energy-winds (prāṇa)."}]},{script:"ཀཾ",wylie:"kaM",phon:"kaṃ",gloss:"water element (āpa/jala)",syllables:[{tib:"ཀཾ",wylie:"kaM",phon:"kaṃ",note:"The letter ཀ (ka, unvoiced velar stop) with the anusvāra ཾ. Read 'kaṃ' — the anusvāra gives a resonant nasal close. Kaṃ is the seed syllable of the water element in this lineage's version of the mantra; other traditions may use Vaṃ (va + anusvāra) for water. The specific syllable used reflects the oral lineage transmission."}]},{script:"རཾ",wylie:"raM",phon:"raṃ",gloss:"fire element (agni/tejas)",syllables:[{tib:"རཾ",wylie:"raM",phon:"raṃ",note:"The letter ར (ra, the Sanskrit liquid consonant) with the anusvāra ཾ. Read 'raṃ'. Raṃ is universally recognized across Hindu and Buddhist tantric traditions as the seed syllable of the fire element (agni, tejas). The rolling 'r' combined with the resonant nasal close evokes the crackling, spreading quality of fire. Associated in Vajrayāna with Amitābha and the transformation of desire into discriminating wisdom."}]},{script:"ལཾ",wylie:"laM",phon:"laṃ",gloss:"earth element (pṛthivī)",syllables:[{tib:"ལཾ",wylie:"laM",phon:"laṃ",note:"The letter ལ (la, the Sanskrit lateral consonant) with the anusvāra ཾ. Read 'laṃ'. Laṃ is the seed syllable of the earth element (pṛthivī). The lateral 'l' grounded by the anusvāra resonance evokes the stable, all-supporting quality of earth. In Vajrayāna, associated with Ratnasambhava and the wisdom of equanimity — recognizing the equal preciousness of all phenomena."}]},{script:"ཤུདྡྷེ་ཤུདྡྷེ",wylie:"shud+d+he shud+d+he",phon:"śuddhe śuddhe",gloss:"purify! purify!",syllables:[{tib:"ཤུདྡྷེ",wylie:"shud+d+he",phon:"śuddhe",note:"The letter ཤ (śa, the palatal sibilant) with the u-sign ུ giving ཤུ (śu), followed in the same block by ད (da) with a subjoined ད and the aspiration mark ྷ stacked beneath it, plus the e-sign ེ: དྡྷེ (ddhe). The stack དྡྷ is a Sanskrit-only combination in Tibetan script (the same one seen in སིདྡྷི, siddhi) representing the geminate voiced aspirate 'ddh', a sound absent from native Tibetan phonology. Together: 'śuddhe'. Derives from √śudh ('to purify'); śuddhe is a vocative/imperative: 'O pure one!' or 'Purify!'"},{tib:"ཤུདྡྷེ",wylie:"shud+d+he",phon:"śuddhe",note:"Exact repetition of the preceding syllable. In Sanskrit, doubling a verb or verbal form intensifies its force: 'purify! purify!' — a strong, repeated invocation applied to all five elements named before it: may space, wind, water, fire, and earth each be thoroughly purified."}]},{script:"ཨ་ཨ",wylie:"a a",phon:"a a",gloss:"the primordial seed syllable, repeated",syllables:[{tib:"ཨ",wylie:"a",phon:"a",note:"The Tibetan letter ཨ in its bare form — the vowel carrier with no vowel sign, representing the short Sanskrit vowel 'a'. This is the first letter of both the Sanskrit and Tibetan alphabets and is considered the most fundamental sound: every consonant when pronounced alone carries the inherent 'a'. In tantric Buddhism ཨ represents the dharmakāya, primordial purity (ka dag), and the unborn nature of mind — the ground from which all elements and phenomena arise."},{tib:"ཨ",wylie:"a",phon:"a",note:"Exact repetition of ཨ. The doubling seals the mantra: two syllables of primordial awareness recalling the ultimate nature underlying and pervading all five elements. Some traditions chant this as 'Āḥ Āḥ' (ཨཱཿ ཨཱཿ, with visarga) rather than bare 'A A'; the variant reflects distinct lineage transmissions."}]}],wordGrouping:"Twelve syllable-blocks divide into four natural groups that move from the universal to the specific and back: Oṃ-Āḥ-Hūṃ (the three vajras — body, speech, and mind of all Buddhas; they bless and frame the practice) | E-Yaṃ-Kaṃ-Raṃ-Laṃ (the five element seed syllables in order: space, wind, water, fire, earth — invoking each element by its Sanskrit bīja) | Śuddhe-Śuddhe (the purification command, applied retroactively to all five elements) | A-A (the primordial seed syllable repeated, sealing the mantra in the nature of mind). The arc moves outward into the manifest world of elements and then returns to the source."}},{id:"maha-mrityunjaya",title:"Mahāmṛtyuñjaya Mantra (Oṃ Tryambakaṃ Yajāmahe)",deity:"Rudra / Śiva as Tryambaka, the Three-Eyed One (Ṛgveda 7.59.12)",tags:["Śiva","Rudra","Vedic","Hindu","healing","long life","conquering death","Rigveda"],sanskrit:{script:"ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान् मृत्योर्मुक्षीय माऽमृतात् ॥",transliteration:"oṃ tryambakaṃ yajāmahe sugandhiṃ puṣṭi-vardhanam | urvārukam iva bandhanān mṛtyor mukṣīya mā'mṛtāt",translation:"Oṃ. We worship the Three-Eyed One, fragrant, who increases nourishment. As a cucumber (is freed) from its stalk, may I be freed from death — not from immortality.",lines:[{script:"ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम्",translit:"oṃ tryambakaṃ yajāmahe sugandhiṃ puṣṭi-vardhanam",gloss:"Oṃ. We worship the Three-Eyed One, fragrant, increaser of nourishment",note:"The first half-verse is pure praise: three accusatives (tryambakam, sugandhim, puṣṭi-vardhanam) all describe the object of the one verb yajāmahe ('we worship'). oṃ is not part of the Ṛgvedic text; it is prefixed in later recitation."},{script:"उर्वारुकमिव बन्धनान् मृत्योर्मुक्षीय माऽमृतात्",translit:"urvārukam iva bandhanān mṛtyor mukṣīya mā'mṛtāt",gloss:"As a cucumber from its stalk, may I be freed from death — not from immortality",note:"The second half-verse is the petition, built on a simile: a ripe cucumber drops from its stem without force. Three ablatives (bandhanāt, mṛtyoḥ, amṛtāt) answer the question 'freed from what?' — from the stalk, from death, but not from the deathless state."}],words:[{word:"oṃ",gloss:"sacred syllable",note:"The praṇava. Not found in the Ṛgveda verse itself (RV 7.59.12), where the hymn begins directly wit
