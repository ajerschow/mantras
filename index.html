h tryambakaṃ; it is added in the mantra's later liturgical form.",grammar:"Indeclinable sacred particle (praṇava); not assigned to a part of speech in classical grammar."},{word:"tryambakaṃ",gloss:"the Three-Eyed One (accusative)",note:"tri ('three') + ambaka ('eye') → tryambaka, 'three-eyed', an epithet of Rudra/Śiva whose third eye is the eye of wisdom (and of destruction). The oldest Vedic sense may be 'having three mothers' (ambā, 'mother'), but the 'three-eyed' reading is the one followed by the tradition. Sandhi: the final -i of tri becomes -y before the vowel a- (yaṇ-sandhi), giving try-ambaka; the final -m becomes anusvāra before the following y-.",grammar:"Accusative singular masculine of the a-stem tryambaka (a bahuvrīhi compound: 'he whose eyes are three'), direct object of yajāmahe."},{word:"yajāmahe",gloss:"we worship / we offer sacrifice",note:"The single finite verb of the praise-half. √yaj means 'to worship, to offer sacrifice' — in the Vedic setting a literal ritual offering; in later recitation, worship by the mantra itself.",grammar:"1st person plural, present indicative, ātmanepada (middle voice) of √yaj (class 1): yaj-ā-mahe. The middle voice is regular for 'sacrificing for one's own benefit'."},{word:"sugandhiṃ",gloss:"fragrant, sweet-smelling (accusative)",note:"su- ('well, good') + gandha ('smell') → sugandhi, 'of good fragrance'. Understood as the fragrance of Śiva's virtues and the sweetness he spreads, like that of a flower. Sandhi: final -m → anusvāra ṃ before the following p- of puṣṭi.",grammar:"Accusative singular masculine of the Vedic i-stem bahuvrīhi sugandhi ('whose scent is good'; classical Sanskrit would use sugandha), in agreement with tryambakam."},{word:"puṣṭi-vardhanam",gloss:"the increaser of nourishment / prosperity (accusative)",note:"puṣṭi ('nourishment, thriving, prosperity' — the same word as in the White Tārā mantra's puṣṭiṃ kuru) + vardhana ('increasing, causing to grow', from the causative of √vṛdh 'to grow'). The compound names Śiva as the one who makes all nourishment and well-being increase. The final -m is kept as a full consonant here because it stands before the pause at the end of the half-verse.",grammar:"Accusative singular masculine of the tatpuruṣa compound puṣṭi-vardhana ('increaser of puṣṭi'); vardhana is an agent/action noun in -ana from the causative stem vardhaya-. Third of the three accusatives governed by yajāmahe."},{word:"urvārukam iva",gloss:"like a cucumber",note:"urvāruka is a cucumber or melon of the kind that ripens on a creeping vine and, when ripe, detaches from its stalk by itself. iva is the comparison particle 'like, as'. The image is of a release that happens naturally, without violence, at the right time.",grammar:"urvārukam: nominative/accusative singular of the neuter a-stem urvāruka, here the subject of the implied verb of the simile ('as a cucumber [is freed]'). iva: indeclinable comparative particle, always placed after the word it compares."},{word:"bandhanān",gloss:"from the stalk / from bondage (ablative)",note:"bandhana means 'binding, bond, fetter' and, concretely, the stem that binds the fruit to the vine — so the word works on both levels of the simile: the cucumber's stalk and the bonds of mortality. Sandhi: the underlying bandhanāt ends in -t, which becomes -n before the nasal m- of mṛtyoḥ (bandhanāt + mṛtyoḥ → bandhanān mṛtyoḥ).",grammar:"Ablative singular of the neuter a-stem bandhana (a-stem ablative singular = stem + -āt), 'from the bond'; final -t → -n by consonant sandhi before m-."},{word:"mṛtyor",gloss:"from death (ablative)",note:"mṛtyu, 'death', from √mṛ 'to die' (cognate with Latin mors, English 'mortal'). Sandhi: the underlying mṛtyoḥ ends in visarga, which becomes -r before the voiced m- of mukṣīya.",grammar:"Ablative singular of the masculine u-stem mṛtyu: u-stem ablative singular = guṇa of the stem vowel (u → o) + -ḥ, giving mṛtyoḥ; visarga → r before a voiced consonant."},{word:"mukṣīya",gloss:"may I be freed / released",note:"The verb of the petition, from √muc 'to release, let go' — the same root as muñca in the Vajrasattva mantra (mā me muñca, 'do not abandon me'). The form is first person singular: the worshipper asks for their own release, in the middle voice ('may I be released [for myself]').",grammar:"1st person singular, precative (āśīrliṅ, the benedictive optative) ātmanepada of √muc: muc + s-īya → mukṣīya (c → k before s; s → ṣ after k by ruki). The precative expresses a wish or prayer, 'may I...'."},{word:"mā'mṛtāt",gloss:"not from immortality",note:"mā + amṛtāt. amṛta ('the deathless, immortality', a- 'not' + mṛta 'dead') is the opposite of mṛtyu. The line thus ends on a contrast: 'free me from death, but not from immortality'. Sandhi: mā + amṛtāt → mā'mṛtāt (ā + a → ā; the lost initial a- is marked in writing by the avagraha ऽ, which is silent). Note that mā is normally the prohibitive particle ('do not...!'); its use here as a plain 'not' is a Vedic peculiarity that commentators from Sāyaṇa onward have had to explain.",grammar:"mā: indeclinable negative particle (here used as simple negation rather than prohibition). amṛtāt: ablative singular of the neuter a-stem amṛta (stem + -āt), parallel to bandhanāt and mṛtyoḥ, all governed by mukṣīya ('be freed from')."}]},tibetan:null}];function ah({id:e,label:t,sublabel:n,labelClassName:a,openChipId:i,setOpenChipId:o,children:r}){const s=i===e,l=F.useRef(null),[d,g]=F.useState(0);return F.useEffect(()=>{if(!s){g(0);return}const p=l.current;if(!p)return;const f=12,v=p.getBoundingClientRect();let b=0;v.left<f?b=f-v.left:v.right>window.innerWidth-f&&(b=window.innerWidth-f-v.right),g(b)},[s]),m.jsxs("div",{className:"chip-wrap",children:[m.jsxs("button",{type:"button",className:"chip"+(s?" chip-active":""),"aria-expanded":s,onClick:()=>o(s?null:e),children:[m.jsx("span",{className:"chip-label"+(a?` ${a}`:""),children:t}),n&&m.jsx("span",{className:"chip-sublabel",children:n})]}),s&&m.jsx("div",{ref:l,className:"chip-popup",sty
