<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantra Explorer</title>
    <script>
      try {
        if (localStorage.getItem("mantra-explorer-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
        var f = localStorage.getItem("mantra-explorer-sa-font");
        if (f) document.documentElement.dataset.saFont = f;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
